<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norway Restaurant</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="resto.css">
</head>
<body>
    <!-- nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                Norway Restaurant
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Menu</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                     <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
                <button class="btn btn-warning ms-3">
                    Reserve Table
                </button>
            </div>
        </div>

    </nav>
    <!-- section -->
     <section class="bg-dark text-white text-center py-5">
        <div class="container">
            <h1 class="display-3 fw-bold">
                Welcome to Norway Restaurant
            </h1>
            <p class="lead my-4">
                Experience authentic Scandinavian cuisine with fresh ingredients and unforgettable flavours.
            </p>
            <button class="btn btn-warning btn-lg-me-2">
                View Menu
            </button>
            <button class="btn btn-outline-light btn-lg">
                Book a Table
            </button>
        </div>
     </section>
     <div id="restaurantCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="../Images/ChatGPT Image Jun 16, 2026, 11_32_29 PM.png"
                 class="d-block w-100"
                 alt="Restaurant Interior">
        </div>

        <div class="carousel-item">
            <img src="../Images/ChatGPT Image Jun 19, 2026, 12_43_31 AM.png"
                 class="d-block w-100"
                 alt="Salmon Dish">
        </div>

        <div class="carousel-item">
            <img src="../Images/ChatGPT Image Jun 19, 2026, 12_45_17 AM.png"
                 class="d-block w-100"
                 alt="Dining Area">
        </div>

    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#restaurantCarousel"
            data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

    </button>

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#restaurantCarousel"
            data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

    </button>

</div>
    
</body>
</html>
